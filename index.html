<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>魔法屋</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .screen {
      display: none;
      text-align: center;
      width: 100%;
    }

    .active {
      display: block;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    input {
      width: 60%;
      padding: 10px;
      font-size: 16px;
      margin-top: 20px;
    }

    video {
      width: 80%;
      max-width: 800px;
    }

  </style>
</head>

<body>

  <!-- ① 封面 -->
  <div id="cover" class="screen active">
    <h1>魔法屋</h1>
    <button onclick="startGame()">开始</button>
  </div>

  <!-- ② 对话输入 -->
  <div id="dialog" class="screen">
    <p>请输入任意内容：</p>
    <input id="userInput" placeholder="在这里输入..." />
    <br><br>
    <button onclick="confirmInput()">确认</button>
  </div>

  <!-- ③ 视频播放 -->
  <div id="videoScreen" class="screen">
    <video
  id="gameVideo"
  controls
  muted
  autoplay
  playsinline
  style="width:80%; max-width:800px;"
>
  <source src="video.mp4" type="video/mp4">
</video>
  </div>

  <script>
    function startGame() {
      document.getElementById("cover").classList.remove("active");
      document.getElementById("dialog").classList.add("active");
    }

    function confirmInput() {
      const text = document.getElementById("userInput").value;

      if (text.trim() === "") {
        alert("请输入内容");
        return;
      }

      document.getElementById("dialog").classList.remove("active");
      document.getElementById("videoScreen").classList.add("active");

      document.getElementById("gameVideo").play();
    }
  </script>

</body>
</html>
